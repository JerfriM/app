<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>{{ isRegisterMode ? 'Registro Académico' : 'Acceso al Sistema' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="auth-container" style="max-width: 450px; margin: auto; margin-top: 10%;">
    
    <ion-icon name="fingerprint-outline" color="primary" style="font-size: 96px; margin-bottom: 10px;"></ion-icon>
    
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión' }}</ion-card-title>
        
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="none">
          
          <ion-item class="ion-margin-bottom" *ngIf="isRegisterMode" style="border: 1px solid #ccc; border-radius: 8px;">
            <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
            <ion-input type="text" placeholder="Nombre completo" [(ngModel)]="name"></ion-input>
          </ion-item>

          <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
            <ion-icon name="id-card-outline" slot="start" color="medium"></ion-icon>
            <ion-input type="text" placeholder="Matrícula" [(ngModel)]="matricula"></ion-input>
          </ion-item>

          <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input type="password" placeholder="Contraseña" [(ngModel)]="password"></ion-input>
          </ion-item>

        </ion-list>

        <ion-button expand="block" shape="round" class="ion-margin-top" (click)="ejecutarAccion()">
          {{ isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión' }}
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>

        <ion-button expand="block" fill="clear" size="small" class="ion-margin-top" (click)="toggleModo()">
          {{ isRegisterMode ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes usuario? Regístrate aquí' }}
        </ion-button>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-refresher slot="fixed" (ionRefresh)="cargarDatosEnParalelo()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando datos en paralelo con forkJoin...</p>
  </div>

  <div *ngIf="!cargando">

    <ion-card>
      <ion-card-header>
        <ion-card-title>Resumen del Sistema</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <ion-col class="ion-text-center">
              <h1>{{ totalUsuarios }}</h1>
              <p>Usuarios registrados</p>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Módulos</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" class="ion-margin-bottom" (click)="irAUsuarios()">
          <ion-icon slot="start" name="people-outline"></ion-icon>
          Gestión de Usuarios (CRUD)
        </ion-button>
        
        <ion-button expand="block" class="ion-margin-bottom" (click)="irAUpload()">
          <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
          Subida de Archivos
        </ion-button>

        
      </ion-card-content>
    </ion-card>


    <ion-button expand="block" fill="outline" color="warning" (click)="irANotificaciones()">
  <ion-icon slot="start" name="notifications-outline"></ion-icon>
  Enviar Notificación
</ion-button>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Usuarios Recientes</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let user of usuarios">
            <ion-avatar slot="start">
              <ion-icon name="person-circle-outline" style="font-size: 36px;"></ion-icon>
            </ion-avatar>
            <ion-label>
              <h2>{{ user.name }}</h2>
              <p>Matrícula: {{ user.matricula }}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
    <ion-button expand="block" fill="outline" color="primary" (click)="irANotificaciones()" style="margin-top: 15px;">
  <ion-icon slot="start" name="notifications-outline"></ion-icon>
  Módulo de Notificaciones
</ion-button>

  </div>

</ion-content>
